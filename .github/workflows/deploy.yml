name: Deploy API

on:
    push:
        branches: [production]

    workflow_dispatch:
        inputs:
            ref:
                description: Commit SHA to deploy (blank = tip of production). Use an older SHA to roll back.
                required: false

concurrency:
    group: deploy-production
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/collabo-digital/crm-api

jobs:
    # The image is built only from a commit whose unit tests pass.
    test:
        if: github.repository == 'Collabo-Digital/crm'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: server
        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ inputs.ref || github.sha }}

            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm
                cache-dependency-path: server/package-lock.json

            - run: npm ci --legacy-peer-deps --no-audit --no-fund

            - run: npx prisma generate
              env:
                DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

            - run: npx jest

    build:
        needs: test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            sha: ${{ steps.meta.outputs.sha }}
        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ inputs.ref || github.sha }}

            - id: meta
              run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                context: server
                push: true
                tags: |
                    ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
                    ${{ env.IMAGE }}:production
                labels: org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: read

        env:
            # Host alias defined in ~/.ssh/config by the Configure SSH step.
            SSH: ssh droplet
        steps:
            - uses: actions/checkout@v4
              with:
                ref: ${{ needs.build.outputs.sha }}

            - name: Configure SSH
              env:
                HOST: ${{ secrets.DROPLET_HOST }}
                KEY: ${{ secrets.DROPLET_SSH_KEY }}
                KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
              run: |
                install -d -m 700 ~/.ssh
                printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
                printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                cat > ~/.ssh/config <<EOF
                Host droplet
                  HostName $HOST
                  User root
                  IdentityFile ~/.ssh/id_deploy
                  IdentitiesOnly yes
                EOF
                chmod 600 ~/.ssh/config
                # Fails here with a clear error if the secret is not a valid private key;
                # the public half printed must match the droplet's authorized_keys.
                echo "Deploy key: $(ssh-keygen -y -f ~/.ssh/id_deploy)"

            - name: Log the droplet in to GHCR (token expires when this job ends)
              env: 
                TOKEN: ${{ secrets.GITHUB_TOKEN }}

              run: printf '%s' "$TOKEN" | $SSH "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
            
            - name: Deploy
              run: $SSH "bash -s -- ${{ needs.build.outputs.sha }}" < server/deploy/deploy.sh