services:
  - type: web
    name: collabo-crm
    runtime: node
    plan: starter
    buildCommand: >-
      cd client && npm ci && npm run build &&
      cd ../server && npm ci --legacy-peer-deps &&
      npx prisma generate &&
      npx prisma migrate deploy &&
      npm run build
    startCommand: cd server && node dist/main
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SERVE_STATIC
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Render's load balancer is one proxy hop; without this every client
      # shares one rate-limit bucket.
      - key: TRUST_PROXY
        value: "1"
      # Verification codes, password resets and invites are sent over SMTP.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_WEBHOOK_VERIFY_TOKEN
        sync: false
