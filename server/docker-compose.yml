# ──────────────────────────────────────────────────────────────────────────────
# Docker Compose for the NestJS API + Redis + Caddy reverse proxy (HTTPS via sslip.io).
#
# The `api` image is built by GitHub Actions on every push to `production`
# (.github/workflows/deploy.yml) and pushed to GHCR; the droplet only pulls it.
# `build:` is kept as a manual fallback (docker compose build api).
#
# The `api` service is internal-only (no host port binding). Caddy publishes
# 80 and 443 and reverse-proxies to api:5000 over the internal `webnet` docker
# network. Caddy automatically provisions a Let's Encrypt cert for the domain
# set in CADDY_DOMAIN (e.g. 168.144.82.109.sslip.io).
#
# Required env vars (in server/.env):
#   CADDY_DOMAIN       — e.g. 168.144.82.109.sslip.io
#   CADDY_ACME_EMAIL   — for Let's Encrypt renewal notices
#
# Usage:
#   docker compose up -d             # start everything (deploy.sh handles pulling the api image)
#   docker compose logs -f caddy     # watch TLS provisioning
#   docker compose down
# ──────────────────────────────────────────────────────────────────────────────

services:
  api:
    image: ghcr.io/collabo-digital/crm-api:production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collabo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Pin PORT so it can't drift from Dockerfile's default (80).
      PORT: "5000"
    expose:
      - "5000"   # internal-only, reachable by other services on webnet
    volumes:
      # Chat media (customer photos, documents, voice notes) copied from Meta.
      # Private files, so not under /uploads; must outlive container redeploys.
      - messaging_media:/app/storage/messaging
      # Product images uploaded in the CRM (LocalImageStorage, served at /uploads).
      - uploads:/app/uploads
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: collabo-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: collabo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # Let's Encrypt certs + account info (persists)
      - caddy_config:/config     # Caddy's autosaved config
    environment:
      # Read by Caddyfile via {$CADDY_DOMAIN} / {$CADDY_ACME_EMAIL}
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-admin@example.com}
    networks:
      - webnet
    depends_on:
      api:
        condition: service_healthy

networks:
  webnet:

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  messaging_media:
  uploads:
