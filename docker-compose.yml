# ──────────────────────────────────────────────────────────────────────────────
# Docker Compose for Collabo CRM
#
# Services:
#   - app       NestJS server + React SPA (port 80)
#   - postgres  PostgreSQL 16 database
#   - redis     Redis 7 (for BullMQ + sessions)
#
# Usage:
#   docker compose up -d           # start all services in background
#   docker compose logs -f app     # tail app logs
#   docker compose down            # stop and remove containers
#   docker compose down -v         # stop and remove containers + volumes
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: collabo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-collabo_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabo} -d ${POSTGRES_DB:-collabo_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - collabo-network

  redis:
    image: redis:7-alpine
    container_name: collabo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - collabo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_META_APP_ID: ${META_APP_ID}
    container_name: collabo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Core
      NODE_ENV: production
      PORT: 80
      # Enable static frontend serving (this stack bundles the React SPA)
      SERVE_STATIC: "true"

      # Database (uses internal Docker network DNS)
      DATABASE_URL: postgresql://${POSTGRES_USER:-collabo}:${POSTGRES_PASSWORD:-collabo_dev_password}@postgres:5432/${POSTGRES_DB:-collabo_crm}
      # Local Postgres has no pooler, so the direct URL is the same as DATABASE_URL.
      DIRECT_URL: postgresql://${POSTGRES_USER:-collabo}:${POSTGRES_PASSWORD:-collabo_dev_password}@postgres:5432/${POSTGRES_DB:-collabo_crm}

      # Redis
      REDIS_URL: redis://redis:6379

      # App URLs (override FRONTEND_URL for production; APP_URL must be set, https)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_URL: ${APP_URL}
      # Proxy hops in front of this container: 1 behind Cloudflare or another
      # proxy, 0 when reached directly (must be set)
      TRUST_PROXY: ${TRUST_PROXY}

      # JWT secrets (must be set in .env)
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

      # Encryption (32 chars exactly)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Email (SMTP host, user and password must be set: NODE_ENV is production)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@yourcrm.com}
      FROM_NAME: ${FROM_NAME:-Collabo CRM}
      REPLY_TO_EMAIL: ${REPLY_TO_EMAIL:-}

      # Optional integrations
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_CONFIG_ID: ${WHATSAPP_CONFIG_ID:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v21.0}
      MESSENGER_CONFIG_ID: ${MESSENGER_CONFIG_ID:-}
      MESSENGER_WEBHOOK_VERIFY_TOKEN: ${MESSENGER_WEBHOOK_VERIFY_TOKEN:-}
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      # Chat media copied from Meta, and product images uploaded in the CRM;
      # both must outlive the container.
      - messaging_media:/app/server/storage/messaging
      - uploads:/app/server/uploads
    networks:
      - collabo-network

volumes:
  postgres_data:
  redis_data:
  messaging_media:
  uploads:

networks:
  collabo-network:
    driver: bridge
